name: QA-CI-CD

on:
  push:
    branches:
      - qa
 # workflow_run:
  #  workflows: ["app-workfloww"]
    #types:
    #  - completed
    #branches:
     # - dev

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: 22
  IMAGE_NAME: fc27

jobs:

  # 1. Code Quality
  lint:
    name: Code Quality
    #if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful DEV commit
        uses: actions/checkout@v4
     #   with:
          #ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      # Optional formatting check
      - name: Check formatting
        run: npm run format:check
        continue-on-error: true


  # 2. Security Scanning
  security:
    name: Security Scanning
    #if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful DEV commit
        uses: actions/checkout@v4
        #with:
          #ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: NPM Audit Report
        run: npm audit --json > npm-audit.json || true

      - name: Security Gate - HIGH and CRITICAL
        run: |
          node -e "
          const report = require('./npm-audit.json');
          const v = report.metadata.vulnerabilities;
          console.log('High:', v.high);
          console.log('Critical:', v.critical);
          if (v.high > 0 || v.critical > 0) {
            console.error('Security gate failed!');
            process.exit(1);
          }
          console.log('Security gate passed!');
          "

      - name: Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-report
          path: npm-audit.json

  # 3. SAST - CodeQL
  codeql:
    name: CodeQL SAST
   # if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout successful DEV commit
        uses: actions/checkout@v4
       # with:
         # ref: ${{ github.event.workflow_run.head_sha }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3


  # 4. Automated Testing
  tests:
    name: Automated Tests
    #if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful DEV commit
        uses: actions/checkout@v4
       # with:
         # ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        run: npm run test:unit
        continue-on-error: true

      - name: Integration Tests
        run: npm run test:integration
        continue-on-error: true

      - name: Test Coverage
        run: npm run test:coverage
        continue-on-error: true



  # 5. Build and Push Docker Image
  build:
    name: Build and Push QA Image
    needs: [lint, security, codeql, tests]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

   # outputs:
      #image_tag: latest

    steps:
      - name: Checkout successful DEV commit
        uses: actions/checkout@v4
        #with:
         # ref: ${{ github.event.workflow_run.head_sha }}

      #- name: Set Image Tag
        #id: image
        ## echo "tag=qa-${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push QA Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/fc27:latest


 
  # 6. Deploy to QA VM
  deploy-qa:
    name: Deploy to QA
    needs: build
    runs-on: self-hosted

    steps:
      - name: Pull QA Docker Image
        run: |
          docker pull  ${{ vars.DOCKERHUB_USERNAME }}/fc27:latest



      - name: Run QA Container
        run: |
          docker stop fc27-qa || true
          docker rm fc27-qa || true
          docker run -d \
            --name fc27-qa \
            --restart unless-stopped \
            -p 3000:3000 \
             ${{ vars.DOCKERHUB_USERNAME }}/fc27:latest


  # 7. Smoke Testing / Health Checks
  smoke-tests:
    name: QA Smoke Tests
    needs: deploy-qa
    runs-on: ubuntu-latest

    steps:
      - name: Check application HTTP response
        run: |
          for i in {1..12}; do
            if curl -fsS "${{ secrets.QA_URL }}/health"; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Waiting for application..."
            sleep 10
          done

          echo "Health check failed!"
          exit 1


  # 8. QA Validation
  qa-validation:
    name: QA Functional and E2E Tests
    needs: smoke-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout successful DEV commit
        uses: actions/checkout@v4
        #with:
         # ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run QA E2E Tests
        run: npm run test:e2e
        env:
          BASE_URL: ${{ secrets.QA_URL }}


  # 9. Manual QA Approval
  qa-approval:
    name: QA Approval
    needs: qa-validation
    runs-on: ubuntu-latest

    environment: qa-approval

    steps:
      - name: QA Approved
        run: echo "QA approval received!"


  # 10. Allow Production Promotion
  production-ready:
    name: Ready for Production
    needs: qa-approval
    runs-on: ubuntu-latest

    steps:
      - name: Release Approved
        run: |
          echo "QA validation and approval successful."
          echo "Image is ready for production promotion."