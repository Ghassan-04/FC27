name: app-workflow
####
on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  NODE_VERSION: 22
  IMAGE_NAME: fc27

jobs:
  test:
    name: DEV tests and security gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Generate NPM security report
        if: always()
        run: npm audit --json > npm-audit-report.json || true

      - name: NPM security gate
        run: npm audit --audit-level=high

      - name: Upload NPM audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-report
          path: npm-audit-report.json
          if-no-files-found: ignore

      - name: Run tests
        run: npm test

  build-and-deploy-dev:
    name: Build once and deploy to DEV
    needs: test
    runs-on: [self-hosted, devv]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The commit SHA is an immutable release identifier. QA and Production
      # will promote this exact image instead of rebuilding the application.
      - name: Build and push DEV image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:dev-latest

